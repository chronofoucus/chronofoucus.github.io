<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoFocus – Daily Goals</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">ChronoFocus</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="todo.html">To-Do</a></li>
            <li><a href="timer.html">Timer</a></li>
            <li><a href="quotes.html">Quotes</a></li>
            <li><a href="reward.html">Rewards</a></li>
        </ul>

    </nav>


    <!-- Main Section -->
    <section class="hero">

        <h1 class="title">🎯 Daily Goals</h1>

        <p class="description">
            Set your daily goals and complete them to become more disciplined.
        </p>


        <!-- Input Area -->
        <div class="button-container">

            <input 
                type="text" 
                id="goalInput" 
                placeholder="Enter your daily goal..."
                style="
                    padding:12px;
                    border-radius:20px;
                    border:none;
                    width:250px;
                    outline:none;
                "
            >

            <button class="main-btn" onclick="addGoal()">
                Add Goal
            </button>

        </div>

    </section>


    <!-- Goals List -->
    <section class="features">

        <div class="feature-box" style="grid-column: 1/-1;">

            <h3>Your Goals</h3>

            <ul id="goalList" style="list-style:none; margin-top:15px;">
                <!-- Goals appear here -->
            </ul>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>© 2026 ChronoFocus – Master Your Time</p>

        <p>Owner: Shalini Navariya</p>

    </footer>


    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="goals.js"></script>

</body>
</html>
